openapi: 3.0.3
info:
  title: Northbeam Goods store API
  version: "1.0.0"
  description: |
    The shared contract for every Northbeam backend. Frozen 2026-10-08
    (Plan 3 freeze item 1). After the freeze a change needs a contract PR that touches only
    contract/ files, merged first. Routes are limited to Plan 3's list; new routes are additive.

    Changed 2026-10-10: orders are saved first (POST /api/orders), then paid (POST /api/orders/{id}/pay);
    the one-request checkout route was removed.

    Changed 2026-10-12 (step 0c spike, additive): PUT /api/account/password, `notices` on GET /api/account,
    POST /api/orders/{id}/cancel, POST /webhooks/fulfillment, POST /demo/orders/{id}/ship, order statuses
    `canceled` and `fulfilled`. One code location per event: signup and login bind the session through one
    function (`signIn`); a password change is decided in one function (`changePassword`); a security notice
    is sent in one function (`sendSecurityNotice`); cancel and fulfill both go through one function
    (`setOrderStatus`), and the demo ship route calls the same handler as the fulfillment webhook.

    Changed 2026-10-12 (card on file, additive): PUT and DELETE /api/account/payment-method, `user.paymentMethod`
    on GET /api/account, `payment` optional on POST /api/orders/{id}/pay (the saved card is used when it is
    omitted), `demoDefaults.paymentMethod`. A successful payment sets `paid` through `setOrderStatus`, so
    paid, canceled and fulfilled share one function; saved and payment_failed have no status event.

    Changed 2026-10-12 (slice 2, additive): promo codes on the cart (POST and DELETE /api/cart/promo; `promotion`
    and `discount` on the cart replies and on an order made from the cart) and account verification (POST
    /api/verification/start and /confirm; `verified` on GET /api/account; the notice kind `verification_code`).
    One code location each: a code is evaluated and the outcome recorded in one function (`applyPromo` in
    lib/promo.js, accepted and rejected alike); every verification outcome (pending, success, failure) is recorded
    by one named function (`recordVerification` in lib/verification.js) that both the start and the confirm call.
    A promo applies to the cart only, never to a saved order.

    Fix round 2026-10-12 (slice 2 review, still additive): a code that stops applying stays on the cart and is
    returned as `promotion` with `applies: false`, a `reason` and `discount` 0; POST /api/orders refuses with 409
    while the cart holds such a code. Verification: the wrong-code count and the lockout belong to the account
    and survive a new code (5 wrong codes lock the account for 15 minutes; a new code can be requested 30 seconds
    after the last; a code is valid for 10 minutes). Under DEMO=1 all of these use the X-Demo-Now clock.
    Changing the email or phone clears `verified` and any code in progress.

    Fix round 2 2026-10-12 (slice 2 review round 2, still additive): `promotion` gains `description`, `type`
    ("percent" or "amount"), `value` and `minimum` (the code's own terms, in plain words and units), on the cart
    and on an order. On a cart `promotion` that no longer applies, `reason` is a status WORD (`unknown`, `expired`,
    `not_applicable`, `already_applied`, `used_up`; the same words the audit record uses) and the sentence for
    display is a separate `message`. The wrong-code count is kept per destination (the address or phone a code
    went to), so a success on one destination does not clear the count of another. PUT /api/account answers 400
    to a non-text email or phone.

    Conventions
    - JSON in and out. A request body must be sent as `Content-Type: application/json`; a body sent with
      any other type (for example `text/plain`) is refused with 415 `{ "error": "Content-Type must be application/json" }`
      (answered last, like bad JSON: unknown route 404, then 401, then resource 404, then 415 or 400). Every POST and
      PUT needs a JSON body, even when there is nothing to send: send `{}`. A request with no body and no
      Content-Type (a bare POST) is 415, so a page on another origin cannot make a state change without a
      CORS preflight. A body over
      100 KB is 413 `{ "error": "Request body too large" }`. Every error is JSON, never an HTML page. Money is in dollars as a JSON number
      (the store never sends micros; micros are a Sift wire concern).
    - Errors: any 4xx or 5xx carries `{ "error": "<human-readable message>" }` unless the
      response below says otherwise.
    - Session: every response sets the `nb_sid` cookie when the request has none or an unknown
      one: `Set-Cookie: nb_sid=sess_<16 hex>; Path=/; SameSite=Lax`. It is an analytics session id
      readable by page scripts (the browser snippet's `_session_id`); who is signed in is kept
      server-side, keyed by `nb_sid`. In-memory: sessions reset on restart.
    - Ids: users `shopper_<n>`, orders `ORD-<n>`, charges `ch_<n>`, continuing after the highest
      id in contract/seed.json (`_meta.nextIds`).
    - Demo mode (`DEMO=1`, set only by tools/run.sh): `/demo/*` routes exist, the persona headers
      are honored, and CORS is answered for `http://localhost:4010` unless the env var `ENGINE_ORIGIN` names another engine origin. Without `DEMO=1`, `/demo/*`
      returns 404 and the persona headers are ignored. Full rule: docs/freeze/FREEZE.md section 11
      in the engine repo.
    - Text rule (one definition for every free-text field: signup and account `name`, address lines,
      city, region, country, zipcode, and the payment `token`): a value is blank when it is not a
      string, is empty, or has only Unicode White_Space characters and the zero-width characters
      U+200B, U+200C, U+200D, U+2060 and U+FEFF (regex `^[\p{White_Space}\u200B\u200C\u200D\u2060\uFEFF]*$`,
      unicode flag). A blank value, or one over 200 characters (code points), is 400. On account update
      a `name` that is null or absent is ignored, as before; any other `name` must pass the rule.
    - Order of answers (additive, clarifying): an unknown route is 404 `{ "error": "Not found" }`;
      then 401 when the route needs a session and there is none; then a resource 404 (for example an
      unknown order id); then 400 `{ "error": "Invalid JSON" }` for a body that is not valid JSON; then the
      route's own validation. A bad body therefore never hides a 404 or 401. An empty body, or a body
      that is not a JSON object, reads as `{}`. Fixture 17-bad-json-order proves the order.
    - Every backend serves `public/` as static files at `/`.
servers:
  - url: http://localhost:3000
tags:
  - name: auth
  - name: account
  - name: cart
  - name: orders
  - name: webhooks
  - name: catalog
  - name: demo
    description: Demo-only. Present only under DEMO=1. The scanner ignores these routes.

paths:
  /api/signup:
    post:
      tags: [auth]
      summary: Create an account and sign in
      description: |
        All four fields are required. The phone is normalized to E.164 (10 digits get +1; 11 to 15
        digits get +). Signs the session in. Sift event (after the patch): $create_account.
        Optional (additive): `billingAddress` and `shippingAddress` (the Address shape, the same rules as an
        order address; an incomplete one is 400). They become the account's billing and default shipping
        addresses. The account lives until the store stops: logout then login with the same email and
        password returns the same user id; only /demo/reset (DEMO=1) or a restart clears it.
      parameters: [ { $ref: "#/components/parameters/DemoClientIp" }, { $ref: "#/components/parameters/DemoUserAgent" }, { $ref: "#/components/parameters/DemoNow" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone, password]
              properties:
                name: { type: string, example: "Avery Alder" }
                email: { type: string, format: email, example: "avery@example.com" }
                phone: { type: string, example: "415-555-0123" }
                password: { type: string, example: "Demo!2026" }
                billingAddress: { $ref: "#/components/schemas/Address" }
                shippingAddress: { $ref: "#/components/schemas/Address" }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { $ref: "#/components/schemas/UserPublic" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/login:
    post:
      tags: [auth]
      summary: Sign in
      description: Sift events (later, P3-REF-10) $login. Not in the base six.
      parameters: [ { $ref: "#/components/parameters/DemoClientIp" }, { $ref: "#/components/parameters/DemoUserAgent" }, { $ref: "#/components/parameters/DemoNow" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { $ref: "#/components/schemas/UserPublic" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/logout:
    post:
      tags: [auth]
      summary: Sign out (the nb_sid cookie stays; the session forgets the user)
      description: Scenario S9 (Log out, then log in again) logs in as seeded shopper_1002 (no reset, no signup), calls this route, logs in again with the same credentials, then reads /api/account.
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean, enum: [true] }, mockReset: { type: boolean, nullable: true, description: "Additive. true/false: result of POST $SIFT_API_URL/__reset; null: no SIFT_API_URL." } } }

  /api/account:
    get:
      tags: [account]
      summary: The signed-in user's account
      description: |
        Additive: `user.billingAddress` and `user.shippingAddress` (the default shipping address), the Address
        shape. The keys are absent when not set. A seeded user's one address is both.
        Additive: `user.paymentMethod` (the saved card: `cardBin`, `cardLast4`, `type`; never its token), absent until saved.
        Additive: `user.verified` (boolean, `false` until POST /api/verification/confirm succeeds).
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/Account" }
                  notices: { type: array, items: { $ref: "#/components/schemas/Notice" }, description: "Additive. The user's security notices the stand-in mailer sent (oldest first); empty until one is sent. Cleared by /demo/reset." }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [account]
      summary: Update name, email, phone, or an address
      description: |
        Any subset of the fields. Phone is normalized to E.164 as in signup; email must be valid.
        Additive: `billingAddress` and `shippingAddress` (the Address shape, the order-address rules:
        every field non-empty text of at most 200 characters; an incomplete one is 400 and nothing
        changes). The reply's `user` carries the addresses that are set.
        Sift event (after the patch): $update_account, sending the full known account fields.
      parameters: [ { $ref: "#/components/parameters/DemoClientIp" }, { $ref: "#/components/parameters/DemoUserAgent" }, { $ref: "#/components/parameters/DemoNow" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                billingAddress: { $ref: "#/components/schemas/Address" }
                shippingAddress: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { $ref: "#/components/schemas/UserPublic" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/account/payment-method:
    put:
      tags: [account]
      summary: Save the card on file
      description: |
        Needs a session. Replaces the account's saved card. Body: `token` (non-empty text, at most 200
        characters), `cardBin` (string, 6 or 8 digits), `cardLast4` (string, 4 digits), and optional `type`
        (free text of at most 200 characters, default `card`; a number or null is 400). A missing or invalid
        field is 400 and nothing changes; unknown extra keys are ignored. The reply and GET /api/account return
        only `cardBin`, `cardLast4` and `type`: the token is kept server-side and the pay route reads it there. Never send raw card data. The
        validation and the save are one function (`savePaymentMethod` in lib/paymentMethod.js), and the pay
        route uses the same card rule. Answered in the usual order: 401, then 415 or 400.
      parameters: [ { $ref: "#/components/parameters/DemoClientIp" }, { $ref: "#/components/parameters/DemoUserAgent" }, { $ref: "#/components/parameters/DemoNow" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentMethod" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { type: object, required: [paymentMethod], properties: { paymentMethod: { $ref: "#/components/schemas/SavedCard" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [account]
      summary: Remove the card on file
      description: Needs a session. Removes the saved card; 200 `{ "ok": true }` also when there was none.
      parameters: [ { $ref: "#/components/parameters/DemoClientIp" }, { $ref: "#/components/parameters/DemoUserAgent" }, { $ref: "#/components/parameters/DemoNow" } ]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean, enum: [true] } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/account/password:
    put:
      tags: [account]
      summary: Change the password
      description: |
        Needs a session. `currentPassword` and `newPassword` are both required non-empty strings (the same
        rule as signup: a password must be present). A wrong current password is 400
        `{ "error": "Current password is incorrect" }` and nothing changes. On success the stored password
        changes and the stand-in mailer sends the user a security notice (kind `password_changed`, channel
        email), which then shows in `notices` on GET /api/account. The change goes through one function
        (`changePassword`) that returns the outcome in the store's own words (status success or failure,
        reason user_update); the notice goes through one function (`sendSecurityNotice`).
      parameters: [ { $ref: "#/components/parameters/DemoClientIp" }, { $ref: "#/components/parameters/DemoUserAgent" }, { $ref: "#/components/parameters/DemoNow" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 1 }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean, enum: [true] } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/verification/start:
    post:
      tags: [account]
      summary: Send a verification code
      description: |
        Needs a session. Body `{ "channel": "email" | "sms" }` (anything else is 400). The stand-in sender
        (no message leaves the process) records a notice of kind `verification_code` for the channel (to the
        account's email or phone) and the reply is `{ "status": "pending", "channel": "<channel>" }`. The code
        is never in the reply. Under DEMO=1 the code is the fixed `123456` and the notice carries it as
        `code`, so a demo needs no real inbox; without DEMO=1 the code is random, kept server-side only, and
        no notice or reply shows it. Starting again replaces the code but does NOT clear the failed-attempt count
        or a lockout. A code lives 10 minutes. A new code can be requested 30 seconds after the last one: sooner is
        429 `{ "error": "Wait before sending a new code", "retryAfterSeconds": n }`; while the account is locked
        (5 wrong codes, 15 minutes) it is 429 `{ "error": "Too many wrong codes. Try again later", "retryAfterSeconds": n }`.
        The times use the store's clock (X-Demo-Now under DEMO=1). Changing the account's email or phone voids a
        code in progress. An already verified account is 409 `{ "error": "Your account is already verified" }`.
        Answered in the usual order: 401, then 415 or 400, then 409, then 429.
      parameters: [ { $ref: "#/components/parameters/DemoClientIp" }, { $ref: "#/components/parameters/DemoUserAgent" }, { $ref: "#/components/parameters/DemoNow" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [email, sms] }
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema: { type: object, required: [status, channel], properties: { status: { type: string, enum: [pending] }, channel: { type: string, enum: [email, sms] } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "429":
          description: Wait before sending a new code (30 seconds), or the account is locked (15 minutes)
          content: { application/json: { schema: { $ref: "#/components/schemas/Attempts" } } }

  /api/verification/confirm:
    post:
      tags: [account]
      summary: Confirm the verification code
      description: |
        Needs a session. Body `{ "code": "<text>" }` (a missing, non-text or blank code is 400; spaces around the
        code are ignored). No code started (or the account is already verified, or the email or phone changed
        since the code was sent) is 409 `{ "error": "No verification is in progress" }`.
        A wrong code is 400 `{ "error": ..., "attempts": <failures so far>, "attemptsLeft": <5 minus attempts> }`;
        so is a code older than 10 minutes (`That code has expired. Send a new code`), which also counts as a failure.
        The count belongs to the account and is not cleared by a new code, only by a success or /demo/reset.
        The 5th wrong code locks the account for 15 minutes: every confirm is then 429
        (`{ "error": ..., "attempts": 5, "attemptsLeft": 0, "retryAfterSeconds": n }`), even with the right code,
        and a 429 is neither counted nor recorded as a failure. After the lock the count starts again. The right
        code is 200 `{ "status": "success", "verified": true }` and `verified` is then `true` on GET /api/account.
        Every outcome (pending, which start records, then success or failure with reason `wrong_code` or
        `expired`) goes through one function, `recordVerification` in lib/verification.js. Answered in the usual
        order: 401, then 415 or 400 for the body, then 409, 429, or 400 for a wrong or expired code.
      parameters: [ { $ref: "#/components/parameters/DemoClientIp" }, { $ref: "#/components/parameters/DemoUserAgent" }, { $ref: "#/components/parameters/DemoNow" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "123456" }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema: { type: object, required: [status, verified], properties: { status: { type: string, enum: [success] }, verified: { type: boolean, enum: [true] } } }
        "400":
          description: Invalid body, or a wrong code (then with `attempts` and `attemptsLeft`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Attempts" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "429":
          description: Locked after five wrong codes (15 minutes); not counted as a failure
          content: { application/json: { schema: { $ref: "#/components/schemas/Attempts" } } }

  /api/products:
    get:
      tags: [catalog]
      summary: Product list (from seed.json)
      responses:
        "200":
          description: Products. A bare array, as today.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Product" } }

  /api/cart:
    get:
      tags: [cart]
      summary: The signed-in user's cart (empty array for a guest)
      description: |
        Additive: `promotion` (`{ code, description, type, value, minimum, applies }`) and `discount` (dollars)
        are present while a promo code is applied to the cart. When it no longer applies, `applies` is false,
        `discount` is 0, and `reason` (a status word) and `message` (a sentence) say why. The discount follows the cart: it is worked out
        again each time the cart is read.
      responses:
        "200":
          description: Cart lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartResponse" }

  /api/cart/promo:
    post:
      tags: [cart]
      summary: Apply a promo code to the cart
      description: |
        Needs a session. Body `{ "code": "<text>" }` (a missing, non-text or blank code is 400; the code is
        matched without regard to case or surrounding spaces). Accepted: 200 with the cart, `promotion`
        `{ code, description, type, value, minimum, applies: true }` and `discount` (dollars, two decimals). Rejected: 422 `{ "error": "<reason>" }`, and the cart
        is unchanged. A code longer than 64 characters is unknown. Reasons: the code is unknown; expired; already applied (one code at a time: this code
        again, or a second code while one is applied); not applicable (the cart is empty, or below the code's
        minimum, or the code is used up: a limited-use code stops working after its allowed number of orders).
        A promo is applied to the cart only, never to a saved order: it is counted as used when the order is
        made from the cart. The evaluation and the record of the outcome (accepted or rejected) are one
        function (`applyPromo` in lib/promo.js) that the route calls. Answered in the usual order: 404, 401,
        then 415 or 400 for the body, then 422.
        Seed codes (contract/seed.json `promotions`): WELCOME10 (10 percent), SAVE5 (5 dollars off a cart of 100
        dollars or more), EXPIRED20 (expired), LIMITED25 (25 percent, the first 2 orders only).
      parameters: [ { $ref: "#/components/parameters/DemoClientIp" }, { $ref: "#/components/parameters/DemoUserAgent" }, { $ref: "#/components/parameters/DemoNow" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: WELCOME10 }
      responses:
        "200":
          description: Applied. The cart with the promotion and the discount.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: The code was rejected (unknown, expired, already applied, not applicable)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      tags: [cart]
      summary: Remove the promo code from the cart
      description: Needs a session. Returns the cart without `promotion` or `discount`; 200 also when no code was applied. No body needed; a body sent with a Content-Type other than application/json is 415 (the rule of every route).
      parameters: [ { $ref: "#/components/parameters/DemoClientIp" }, { $ref: "#/components/parameters/DemoUserAgent" }, { $ref: "#/components/parameters/DemoNow" } ]
      responses:
        "200":
          description: Removed. The cart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415":
          description: A body with a Content-Type other than application/json
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/cart/items:
    post:
      tags: [cart]
      summary: Add a product to the cart
      description: Adds qty (default 1) to an existing line or creates one. Sift event (later, P3-REF-10) $add_item_to_cart.
      parameters: [ { $ref: "#/components/parameters/DemoClientIp" }, { $ref: "#/components/parameters/DemoUserAgent" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string, example: p1 }
                qty: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: The whole cart after the add
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/cart/items/{productId}:
    delete:
      tags: [cart]
      summary: Remove a product's line from the cart
      description: |
        Needs a session. Removes the whole line for that product and returns the updated cart like the
        neighbors. A product that is not in the cart (including an unknown product) is 404
        `{ "error": "That product is not in your cart" }`. Goes through one function (`removeCartLine`).
        Sift event (later): $remove_item_from_cart.
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, example: p1 } }
        - { $ref: "#/components/parameters/DemoClientIp" }
        - { $ref: "#/components/parameters/DemoUserAgent" }
        - { $ref: "#/components/parameters/DemoNow" }
      responses:
        "200":
          description: The whole cart after the removal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/orders:
    get:
      tags: [orders]
      summary: The signed-in user's orders, newest first (empty array for a guest)
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema: { type: object, required: [orders], properties: { orders: { type: array, items: { $ref: "#/components/schemas/Order" } } } }

    post:
      tags: [orders]
      summary: Save the cart as an unpaid order
      description: |
        Builds the order from the cart with status saved and empties the cart. Payment is a
        separate step (POST /api/orders/{id}/pay). Sift event (after the patch): $create_order.
        Additive: when a promo code is applied to the cart and still applies, the order carries `promotion`
        `{ code, description, type, value, minimum }` and `discount` (dollars), `total` has the discount taken off (never below 0), and the code is
        counted as used and cleared from the cart. Without a promo the two keys are absent. The discount comes
        from the cart's promo only: no route applies a promo to a saved order. When the cart holds a code that no
        longer applies (`promotion.applies` is false on GET /api/cart: the code expired, ran out, or the cart fell
        below its minimum) the order is refused with 409 `{ "error": "<message>. Review your cart" }`, nothing is
        created, and the cart and the code stay as they are; the shopper removes the code or changes the cart.
        This is by design, even though the cart already shows the full price for such a code: the shopper sees
        the reason and Remove, and no order is made until the code is removed or the cart is fixed.
      parameters: [ { $ref: "#/components/parameters/DemoClientIp" }, { $ref: "#/components/parameters/DemoUserAgent" }, { $ref: "#/components/parameters/DemoNow" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingAddress, billingAddress]
              properties:
                shippingAddress: { $ref: "#/components/schemas/Address" }
                billingAddress: { $ref: "#/components/schemas/Address" }
                shippingMethod: { type: string, enum: [standard, expedited], default: standard }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The cart holds a promo code that no longer applies
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/orders/{id}/shipping:
    put:
      tags: [orders]
      summary: Change the shipping address or method of one of the user's orders (before or after payment)
      description: Allowed while the order is saved, payment_failed, or paid. Sift event (after the patch) $update_order with the full order (a full replace of the $create_order fields).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: ORD-20041 } }
        - { $ref: "#/components/parameters/DemoClientIp" }
        - { $ref: "#/components/parameters/DemoUserAgent" }
        - { $ref: "#/components/parameters/DemoNow" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                shippingAddress: { $ref: "#/components/schemas/Address" }
                shippingMethod: { type: string, enum: [standard, expedited] }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }

  /api/orders/{id}/cancel:
    post:
      tags: [orders]
      summary: Cancel one of the user's orders
      description: |
        Allowed from saved, payment_failed or paid. A fulfilled, canceled, chargeback or pending order
        is 409 `{ "error": "Order cannot be canceled" }`. Same 404 rule as the neighbors (unknown order or
        another user's order). Canceling does not refund. Goes through one function (`setOrderStatus`)
        shared with the fulfillment path.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: ORD-20041 } }
        - { $ref: "#/components/parameters/DemoClientIp" }
        - { $ref: "#/components/parameters/DemoUserAgent" }
        - { $ref: "#/components/parameters/DemoNow" }
      responses:
        "200":
          description: Canceled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }

  /api/orders/{id}/pay:
    post:
      tags: [orders]
      summary: Pay a saved order with a card token
      description: |
        Charges the stand-in gateway. Token `tok_visa` succeeds; `tok_declined` fails with decline
        code `insufficient_funds`; `tok_unavailable` makes the gateway stand-in throw (the store answers 502
        and restores the order). The browser never sends raw card data: only the token, BIN, and
        last four. A payment that is not a string `cardBin` (6 or 8 digits) and a string `cardLast4`
        (4 digits), for example a numeric `cardBin` or a 2-digit `cardLast4`, is 400 and the order
        stays payable. A payment_failed order can be paid again. Sift event (after the patch):
        $transaction for every attempt. On a gateway failure (the gateway is unreachable or errors)
        the order is restored to its state before the claim (status, card, charge id and decline
        code as they were) and the reply is 502 `{"error":"The payment gateway is unavailable. Try again."}`.
        `payment` is optional (additive): when omitted, the account's saved card (`user.paymentMethod`) is
        used (a body that is JSON but not an object, such as `null` or `[]`, is 400 `Request body must be a
        JSON object`, never a fallback; the saved-card path needs a JSON request, so send `{}`); with none saved the reply is 400 `{ "error": "No payment method on file" }` (checked before the
        order's state, like an invalid payment). When present it is used as written. The order snapshots the
        card (`card.bin`, `card.last4`) once payment is attempted, whichever way it was chosen.
        Status events: a successful payment sets the order to `paid` through `setOrderStatus`, the one
        function for paid, canceled and fulfilled (it records the audit entry; allowed from pending only).
        A saved order and a declined one (payment_failed) are NOT reported through it: they have no
        status event.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: ORD-20041 } }
        - { $ref: "#/components/parameters/DemoClientIp" }
        - { $ref: "#/components/parameters/DemoUserAgent" }
        - { $ref: "#/components/parameters/DemoNow" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payment: { $ref: "#/components/schemas/PaymentToken" }
      responses:
        "200":
          description: Paid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: Card declined. The order is payment_failed and can be paid again.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OrderResponse"
                  - type: object
                    required: [error]
                    properties: { error: { type: string, example: "Your card was declined" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "502": { $ref: "#/components/responses/GatewayError" }

  /webhooks/gateway:
    post:
      tags: [webhooks]
      summary: Payment gateway notices (the stand-in PSP calls this)
      description: |
        Dispute notices look up the order by charge id, set `status: chargeback`, and record the
        dispute. Other event types are acknowledged and ignored. No signature check (P3-REF-09).
        A dispute on an order that was never paid (its charge was declined, `payment_failed`) is refused with 409
        `{ "error": "This order was never paid" }` before the order is changed. The test is whether a charge
        succeeded, not the current status, so `paid`, `fulfilled`, `chargeback` and an order canceled after
        payment all pass (a `closed` notice can follow an opened one). An unknown charge is 404.
        Sift event (after the patch): $chargeback.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GatewayEvent" }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema: { type: object, required: [received], properties: { received: { type: boolean, enum: [true] } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }

  /webhooks/fulfillment:
    post:
      tags: [webhooks]
      summary: Shipping partner notices (the stand-in carrier calls this)
      description: |
        `shipment.created` sets the order's status to `fulfilled` (through `setOrderStatus`, the one
        function cancel also uses). Other event types are acknowledged and ignored. No session and no
        signature check, as for /webhooks/gateway. An unknown order is 404 `{ "error": "Order not found" }`;
        an order that is not `paid` is 409 `{ "error": "Order cannot be fulfilled" }`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FulfillmentEvent" }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema: { type: object, required: [received], properties: { received: { type: boolean, enum: [true] } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }

  /api/config:
    get:
      tags: [catalog]
      summary: Which backend answered and its tree hash
      description: |
        `buildHash` is the tree hash (engine app/tools/tree-hash.mjs) that tools/run.sh computes at
        start and passes in env `BUILD_HASH`; null when the store was started without run.sh.
        `version` (additive) names the running copy: env `STORE_VERSION`, default `clean`.
        Present without DEMO=1. `demoDefaults` (additive) is `_meta.demoDefaults` of seed.json (a phone and an
        address the forms prefill when the user has no value); present ONLY under DEMO=1, absent otherwise.
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                type: object
                required: [backend, buildHash, version]
                properties:
                  backend: { type: string, enum: [node, flask, ruby, php] }
                  buildHash: { type: string, nullable: true, pattern: "^[0-9a-f]{64}$" }
                  version: { type: string, description: "Which store copy is running: env STORE_VERSION (run.sh sets the Store_v<N> folder name), default 'clean'." }
                  demoDefaults:
                    type: object
                    description: "Additive, DEMO=1 only."
                    required: [phone, address]
                    properties:
                      phone: { type: string, example: "+14155550100" }
                      address: { $ref: "#/components/schemas/Address" }
                      paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }

  /demo/reset:
    post:
      tags: [demo]
      summary: Reset all in-memory state to contract/seed.json and drop all sessions
      description: DEMO=1 only (404 otherwise). Also resets the mock server-side (additive `mockReset`, see contract/demo-reset-mock.md).
      responses:
        "200":
          description: Reset done
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean, enum: [true] }, mockReset: { type: boolean, nullable: true, description: "Additive. true/false: result of POST $SIFT_API_URL/__reset; null: no SIFT_API_URL." } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /demo/dispute:
    post:
      tags: [demo]
      summary: Make the stand-in gateway send a dispute webhook for an order
      description: |
        DEMO=1 only (404 otherwise). The store builds a GatewayEvent for the order's charge and
        calls its own webhook handler function directly (the same function `/webhooks/gateway` uses; no
        HTTP request is made), so the real (patched) handler runs. `status: needs_response` sends `charge.dispute.created`; `won` or `lost` sends
        `charge.dispute.closed`. No sign-in needed (operator route). The only scenario-specific
        route (Plan 1 6.2). A dispute needs a real payment: an order that was only declined
        (`payment_failed`) is refused with 409 `{ "error": "This order was never paid" }` (the handler's own
        answer, passed through; paid, fulfilled, chargeback and paid-then-canceled orders pass). When the handler itself fails otherwise, the route
        still answers 200 with `ok: false`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string, example: ORD-20041 }
                reason: { $ref: "#/components/schemas/DisputeReason" }
                status: { $ref: "#/components/schemas/DisputeStatus" }
      responses:
        "200":
          description: Webhook delivered; echoes what was sent and the webhook's HTTP status
          content:
            application/json:
              schema:
                type: object
                required: [ok, webhook, webhookStatus]
                properties:
                  ok: { type: boolean }
                  webhook: { $ref: "#/components/schemas/GatewayEvent" }
                  webhookStatus: { type: integer, example: 200 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }

  /demo/orders/{id}/ship:
    post:
      tags: [demo]
      summary: Make the stand-in carrier send a shipment.created notice for an order
      description: |
        DEMO=1 only (404 otherwise). Builds a FulfillmentEvent for the order and calls the store's own
        fulfillment handler function directly (the same function `/webhooks/fulfillment` uses; no HTTP request
        is made). No sign-in needed (operator route). An unknown order is 404; an order that is not paid is
        409 (the handler's own answers pass through).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: ORD-20041 } }
      responses:
        "200":
          description: Notice delivered; echoes what was sent and the handler's status
          content:
            application/json:
              schema:
                type: object
                required: [ok, webhook, webhookStatus]
                properties:
                  ok: { type: boolean }
                  webhook: { $ref: "#/components/schemas/FulfillmentEvent" }
                  webhookStatus: { type: integer, example: 200 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }

components:
  parameters:
    DemoClientIp:
      name: X-Demo-Client-Ip
      in: header
      required: false
      description: DEMO=1 only. Persona client IP from 203.0.113.0/24, 198.51.100.0/24, or 192.0.2.0/24. The framework's normal client-IP accessor returns it.
      schema: { type: string, example: 203.0.113.11 }
    DemoUserAgent:
      name: X-Demo-User-Agent
      in: header
      required: false
      description: DEMO=1 only. Persona user agent; the request's User-Agent header is replaced by it. A scenario step may send its own value to look like a different browser (S4 does, for the login after the failed ones).
      schema: { type: string }
    DemoNow:
      name: X-Demo-Now
      in: header
      required: false
      description: DEMO=1 only. Epoch milliseconds used as "now" for timestamps the store writes (createdAt).
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Not signed in, or wrong email or password
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Unknown resource (or a /demo/* route without DEMO=1)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    StateConflict:
      description: The order's status does not allow this
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    GatewayError:
      description: The payment gateway could not be reached. The order is restored to its state before the claim.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties: { error: { type: string, example: "The payment gateway is unavailable. Try again." } }
    Conflict:
      description: Email already in use
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }

    UserPublic:
      type: object
      required: [id, name, email, phone]
      properties:
        id: { type: string, example: shopper_1026 }
        name: { type: string }
        email: { type: string }
        phone: { type: string, description: E.164, example: "+14155550123" }
        billingAddress: { $ref: "#/components/schemas/Address" }
        shippingAddress: { $ref: "#/components/schemas/Address" }

    Account:
      allOf:
        - $ref: "#/components/schemas/UserPublic"
        - type: object
          required: [createdAt]
          properties:
            createdAt: { type: string, format: date-time }
            paymentMethod: { $ref: "#/components/schemas/SavedCard" }
            verified: { type: boolean, description: "Additive. True after a verification code was confirmed." }

    Product:
      type: object
      required: [id, sku, name, price, brand, category]
      properties:
        id: { type: string, example: p1 }
        sku: { type: string, example: NB-MS-101 }
        name: { type: string }
        price: { type: number, description: dollars, example: 89.0 }
        brand: { type: string }
        category: { type: string }
        description: { type: string }
        image: { type: string, description: "path under frontend/, for example img/merino-sweater.jpg" }

    CartLine:
      type: object
      required: [productId, qty]
      properties:
        productId: { type: string }
        qty: { type: integer, minimum: 1 }

    CartResponse:
      type: object
      required: [cart]
      properties:
        cart: { type: array, items: { $ref: "#/components/schemas/CartLine" } }
        promotion: { $ref: "#/components/schemas/Promotion" }
        discount: { type: number, description: "dollars; present with promotion. 0 when the code no longer applies." }

    Promotion:
      type: object
      required: [code, description, type, value, minimum]
      properties:
        code: { type: string, example: WELCOME10 }
        description: { type: string, example: "10 percent off your order", description: "Short text, the code's terms in plain words." }
        type: { type: string, enum: [percent, amount], description: "percent: `value` is percent points; amount: `value` is currency units (dollars)." }
        value: { type: number, example: 10 }
        minimum: { type: number, example: 0, description: "Smallest cart the code needs, in currency units; 0 when there is none." }
        applies: { type: boolean, description: "On cart replies: false when the applied code no longer applies to the cart (then `reason`, `message` and discount 0). Absent on an order's promotion." }
        reason: { type: string, enum: [unknown, expired, not_applicable, already_applied, used_up], description: "Present when applies is false: the status word (the same words the audit record uses)." }
        message: { type: string, description: "Present when applies is false: why, as a sentence for display. Not a code to map." }

    Attempts:
      type: object
      required: [error]
      properties:
        error: { type: string }
        attempts: { type: integer, description: "wrong or expired codes so far for the account" }
        attemptsLeft: { type: integer }
        retryAfterSeconds: { type: integer, description: "On a 429: seconds until a new code or a confirm is accepted" }

    Address:
      type: object
      required: [name, address1, city, region, country, zipcode]
      properties:
        name: { type: string }
        address1: { type: string }
        address2: { type: string }
        city: { type: string }
        region: { type: string, example: CA }
        country: { type: string, description: ISO 3166-1 alpha-2, example: US }
        zipcode: { type: string, example: "94105" }
        phone: { type: string, description: E.164 }

    PaymentToken:
      type: object
      description: |
        `cardBin` is a string of 6 or 8 digits (`^[0-9]{6}([0-9]{2})?$`); `cardLast4` is a string of
        exactly 4 digits (`^[0-9]{4}$`). A number, a wrong length or non-digits is 400.
      required: [token, cardBin, cardLast4]
      properties:
        token: { type: string, example: tok_visa, description: "tok_declined is declined (insufficient_funds); tok_unavailable makes the gateway stand-in throw (502, the order is restored as it was before the attempt); any other token succeeds. The saved card's token (for example tok_demo_visa) is accepted the same way when the pay route reads it server-side." }
        cardBin: { type: string, pattern: "^[0-9]{6}([0-9]{2})?$", example: "411111" }
        cardLast4: { type: string, pattern: "^[0-9]{4}$", example: "1111" }

    PaymentMethod:
      type: object
      description: |
        The request body for saving the card on file. The API returns it without the token (see SavedCard). Same card rule as the pay
        route: `cardBin` 6 or 8 digits and `cardLast4` 4 digits, both strings; no raw card data.
      required: [token, cardBin, cardLast4]
      properties:
        token: { type: string, example: tok_demo_visa }
        cardBin: { type: string, pattern: "^[0-9]{6}([0-9]{2})?$", example: "411111" }
        cardLast4: { type: string, pattern: "^[0-9]{4}$", example: "1111" }
        type: { type: string, example: card, description: "Free text, at most 200 characters. Defaults to card." }

    SavedCard:
      type: object
      description: |
        The card on file as the API returns it: no token (a reusable credential, kept server-side). Absent until saved.
      required: [cardBin, cardLast4, type]
      properties:
        cardBin: { type: string, pattern: "^[0-9]{6}([0-9]{2})?$", example: "411111" }
        cardLast4: { type: string, pattern: "^[0-9]{4}$", example: "1111" }
        type: { type: string, example: card }

    OrderItem:
      type: object
      required: [productId, sku, name, price, brand, category, qty]
      properties:
        productId: { type: string }
        sku: { type: string }
        name: { type: string }
        price: { type: number, description: dollars }
        brand: { type: string }
        category: { type: string }
        qty: { type: integer }

    Order:
      type: object
      required: [id, userId, items, total, currency, shippingAddress, billingAddress, status, createdAt]
      properties:
        id: { type: string, example: ORD-20041 }
        userId: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
        total: { type: number, description: "dollars, after any discount" }
        promotion: { $ref: "#/components/schemas/Promotion" }
        discount: { type: number, description: "Additive, dollars. Present only when a promo code applied to the cart the order was made from; total already has it taken off." }
        currency: { type: string, enum: [USD] }
        shippingAddress: { $ref: "#/components/schemas/Address" }
        billingAddress: { $ref: "#/components/schemas/Address" }
        shippingMethod: { type: string, enum: [standard, expedited] }
        card:
          type: object
          description: Present once a payment was attempted.
          required: [bin, last4]
          properties: { bin: { type: string }, last4: { type: string } }
        status: { type: string, enum: [saved, pending, paid, payment_failed, canceled, fulfilled, chargeback] }
        chargeId: { type: string, example: ch_50041 }
        declineCode: { type: string, example: insufficient_funds }
        sessionId: { type: string }
        createdAt: { type: string, format: date-time }
        chargeback:
          type: object
          properties:
            reason: { $ref: "#/components/schemas/DisputeReason" }
            status: { $ref: "#/components/schemas/DisputeStatus" }
            receivedAt: { type: string, format: date-time }

    OrderResponse:
      type: object
      required: [order]
      properties:
        order: { $ref: "#/components/schemas/Order" }

    Notice:
      type: object
      required: [to, kind, at]
      properties:
        to: { type: string, description: "the user's email at the time (the phone for the sms channel)" }
        kind: { type: string, enum: [password_changed, verification_code] }
        channel: { type: string, enum: [email, sms] }
        code: { type: string, description: "Additive. The verification code, only under DEMO=1; never present otherwise." }
        at: { type: string, format: date-time }

    FulfillmentEvent:
      type: object
      required: [orderId, event]
      properties:
        orderId: { type: string, example: ORD-20041 }
        event: { type: string, enum: [shipment.created], description: "Other event types may arrive and are acknowledged and ignored." }

    DisputeReason:
      type: string
      description: Gateway dispute reason (Stripe-like). The demo sends only `duplicate` (Plan 1 4.0).
      enum: [duplicate, fraudulent, product_not_received, product_unacceptable, subscription_canceled, general]
      default: duplicate

    DisputeStatus:
      type: string
      description: Gateway dispute status. S0 sends `lost`.
      enum: [needs_response, won, lost]
      default: needs_response

    GatewayEvent:
      type: object
      required: [type, data]
      properties:
        type: { type: string, enum: [charge.dispute.created, charge.dispute.closed], description: "Other types may arrive and are acknowledged and ignored." }
        data:
          type: object
          required: [chargeId, reason, status]
          properties:
            chargeId: { type: string }
            reason: { $ref: "#/components/schemas/DisputeReason" }
            status: { $ref: "#/components/schemas/DisputeStatus" }
            amount: { type: number, description: dollars }
